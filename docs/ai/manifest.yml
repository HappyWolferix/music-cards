# Context-loading manifest for AI assistants working on music-cards.
#
# How to use (works for small models too — follow it literally):
#   1. Match the task's words against `keywords` below. Ties break toward the more specific entry.
#   2. Read the matched docs, and the AGENTS.md overlay of every module you will touch.
#   3. Only then open source files — and only the ones you are changing.
#   4. Before finishing, run the feedback loops for your change type (see AGENTS.md table).

version: 1
entrypoint: AGENTS.md

project:
  name: music-cards
  description: >
    Android companion app for a physical music quiz game. Scans QR codes
    on paper song cards and plays the track via the installed Spotify app.
    Java 11, Android 11+ (minSdk 30), Gradle multi-module.
  language: java
  modules:
    core: pure-Java logic (JVM unit tests)
    app: Android UI + scanning + Spotify hand-off
    cards: JVM CLI generating printable QR card sheets
  test: "make test"
  build_apk: "make apk"

rules:
  alwaysApply:
    - docs/ai/rules/code-style.md
    - docs/ai/rules/boundaries.md
    - docs/ai/rules/verification.md
    - docs/ai/rules/documentation.md

folders:
  - path: core/AGENTS.md
    appliesTo: ["core/**"]
    keywords: [parsing, spotify link, track id, catalog, csv, song list, unit test,
               chart, hitparada, ifpi, top 50, airplay, song key, dedupe key,
               candidate list, wishlist]
    description: Pure-Java logic; every class here must have JVM unit tests.
  - path: app/AGENTS.md
    appliesTo: ["app/**"]
    keywords: [android, activity, ui, camera, scan, qr, zxing, intent, spotify app,
               manifest, permission, layout, strings, slovak]
    description: Android app — thin glue over core/, ZXing scanner, Spotify intent.
  - path: cards/AGENTS.md
    appliesTo: ["cards/**", "data/**"]
    keywords: [cards, print, qr generation, html, sheet, songs.csv, catalog data,
               import, merge, dedupe, chart, hitparada, ifpi, top 50, candidates,
               wishlist, spotify link]
    description: Card sheet generator, playlist importer, and the song catalog data file.

docs:
  - path: docs/architecture/overview.md
    keywords: [architecture, overview, flow, how it works, design, decision]
    description: End-to-end flow (card -> scan -> parse -> Spotify) and why each choice was made.

feedback_loops:
  docs_change: "make validate-ai-docs"
  core_change: "make test"
  any_java_change: "make build"
  app_change: "make lint, then make apk + on-device check for behaviour changes"
  cards_or_data_change: "make cards"
  importer_change: "make test, then make import-charts and review the printed warnings"

gotchas:
  - Android 11 package visibility — the <queries> block in the app manifest is required
    for the Spotify deep link to resolve; removing it breaks playback silently.
  - settings.gradle skips :app when no Android SDK is configured (ANDROID_HOME or
    local.properties). JVM modules still build and test.
  - QR payloads on printed cards are spotify:track: URIs; parsing must stay
    backward-compatible forever (cards are physical).
  - Track ids are exactly 22 base62 chars; SpotifyLink.parseTrackId is the single
    validator — never re-implement link parsing elsewhere.
  - IFPI chart exports (the hitparada .xls snapshots) are HTML tables, not Excel, and have no
    track ids — they can only produce candidates (make import-charts), never cards.
  - SK and CZ charts merge into ONE candidate file and ONE data/songs.csv; the chart a
    file belongs to is read from its header because every download shares a filename.
  - data/candidates.csv is both an output and an input of make import-charts, so every
    column must round-trip — the charts column is the only wishlist marker.
  - data/songs.csv rejects rows without a real spotify:track: link; link-less wishes
    belong in data/candidates.csv or make cards fails.
  - data/songs.csv is hand-maintained and no tool writes it. `make import` (which
    regenerated it from playlist exports) was removed because it wiped hand edits —
    do not reintroduce a generator for the catalog.
  - The first four columns of data/candidates.csv are the catalog shape on purpose, so
    a finished row can be copied straight across by hand.
